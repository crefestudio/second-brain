
<div class="page-container">

  <div class="page-header">

    <div class="breadcrumb">

      <a routerLink="/service">
        내 서비스 관리
      </a>

      <span>›</span>

      <span>서비스 연결 관리</span>

    </div>

    <h1>서비스 연결 관리</h1>

    <p>
      현재 사용 중인 서비스 및 연결 정보를 관리합니다.
    </p>

  </div>

  <div class="table-card">

    <table class="service-table">

    <thead>

      <tr>

        <th>
          사용중인 서비스
        </th>

        <th>

          <div class="th-with-help">

            <span>구매 인증</span>

            <span class="help-icon">

              ⓘ

              <span class="tooltip">

                이전에 구매한 서비스가 현재 계정에 연결되지 않은 경우, 구매 시 사용한 이메일 또는 휴대폰 번호로 확인 신청할 수 있습니다.

              </span>

            </span>

          </div>

        </th>

        <th>

          <div class="th-with-help">

            <span>API 연결</span>

            <span class="help-icon">

              ⓘ

              <span class="tooltip">

                노션 API 연결을 통해 템플릿 생성, 데이터 동기화,
                자동화 기능을 사용할 수 있습니다.

              </span>

            </span>

          </div>

        </th>

        <th>
          연결된 템플릿 정보
        </th>

      </tr>

    </thead>

    <tbody>

      <tr>

  <td>
    라이프업
  </td>

  <td>
    @if (!requestMode) {

      <div class="verify-wrap">

        <span class="badge pending">
          미확인
        </span>

        <button
          class="verify-btn"
          (click)="requestMode = true">

          확인 신청

        </button>

      </div>

    } @else {

      <div class="verify-form">

        <input
          type="text"
          [(ngModel)]="verifyValue"
          placeholder="이메일 또는 휴대폰 번호">

        <button
          class="verify-btn"
          (click)="submitVerification()">

          신청

        </button>

        <button
          class="cancel-btn"
          (click)="cancelVerification()">

          취소

        </button>

      </div>

    }

  </td>

      <td>

      <span class="badge success">
        연결됨
      </span>

    </td>

        <td>

          LifeUp Routine v2.3

        </td>

      </tr>

    </tbody>

  </table>

  </div>

</div>
