<div *ngIf="state=='fail'" class="container" style="text-align:center; margin-top:50px;">
  <h1>⚠️ 연결 정보를 불러오지 못했습니다.</h1>
</div>

<div *ngIf="state=='success'" class="success-wrapper">
  <div class="success-card">
    <h1 class="title">🎉 연결 성공</h1>
    <p class="desc">
      노셔너블 에이전트와 템플릿 연결에 성공하였습니다.<br>
      이제 노셔너블 에이전트가 템플릿에 접근해 다양한 자동화 기능 수행이 가능합니다.  
    </p>
</div>
