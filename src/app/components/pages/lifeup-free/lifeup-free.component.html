<main class="gift-page">
  <article class="gift-card">
    <header class="brand-header"><a href="https://notionable.net"><img src="/assets/images/logo_notionable.png" alt="Notionable"></a></header>
    <span class="eyebrow">LIFEUP FREE GIFT</span>
    <h1>라이프업 스크랩북을<br>무료로 받아보세요</h1>
    <p class="lead">아래 이메일로 ‘라이프업 스크랩북’을 무료로 보내드립니다.</p>
    <section class="form-section">
      <label for="email">신청 이메일</label>
      <input id="email" type="email" autocomplete="email" [(ngModel)]="email" [disabled]="busy" placeholder="example@email.com" (keyup.enter)="confirming = true">
      <label class="consent"><input type="checkbox" [(ngModel)]="marketingConsent" [disabled]="busy"><span><strong>(선택)</strong> 라이프업 소식과 새로운 상품·이벤트·할인 혜택 등 마케팅 정보 수신에 동의합니다.</span></label>
      @if (confirming) {
        <div class="confirmation" role="status">
          <strong>이 이메일로 상품을 받으시겠습니까?</strong>
          <span>이메일을 맞는지 다시 한번 확인해 주세요.</span>
          <button type="button" class="primary-button" [disabled]="busy || !canClaim" (click)="claim()">{{ busy ? '템플릿 준비 중...' : '네, 맞습니다.' }} <span>→</span></button>
        </div>
      } @else {
        <button type="button" class="primary-button" [disabled]="busy || !canClaim" (click)="confirming = true">템플릿 받기 <span>→</span></button>
      }
    </section>
    @if (error) { <p class="error" role="alert">{{ error }}</p> }
  </article>
</main>
