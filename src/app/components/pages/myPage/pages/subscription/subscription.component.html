<div class="page-container">

  <div class="page-header">

    <div class="breadcrumb">
      <a routerLink="/mypage">마이페이지</a>
      <span>›</span>
      <span>구매 정보</span>
    </div>

    <h1>구매 정보</h1>

    <p>
      구매한 템플릿 및 현재 이용 중인 구독 정보를 확인합니다.
    </p>

  </div>

  <!-- 구매 정보 -->

  <div class="section-title">
    구매 정보
  </div>

  <div class="table-card">

    <table class="purchase-table">

      <thead>
        <tr>
          <th>구매한 템플릿</th>
          <th>구매 일자</th>
          <th>구매 확인&nbsp;<span class="help-icon">

              ⓘ

              <span class="tooltip">
                --
              </span>
            </span>
          </th>
          <th>버전</th>
          <th>다운로드</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>라이프업</td>
          <td>-</td>
          <td>
            @if (!requestMode) {

              <div class="verify-wrap">

                <span class="badge pending">
                  미확인
                </span>

                &nbsp;

                <button
                  class="verify-btn"
                  (click)="requestMode = true">

                  확인 신청

                </button>

              </div>

            } @else {

              <div class="verify-form">

                <input
                  type="text"
                  [(ngModel)]="verifyValue"
                  placeholder="이메일 또는 휴대폰 번호">

                <button
                  class="verify-btn"
                  (click)="submitVerification()">

                  신청

                </button>

                <button
                  class="cancel-btn"
                  (click)="cancelVerification()">

                  취소

                </button>

              </div>

            }

          </td>
          <td>
            <span class="badge pending">
              미확인
            </span>
          </td>
          <td> - 
            <!-- <button class="download-btn">
              최신 버전 받기
            </button> -->
          </td>
        </tr> 
      </tbody>

    </table>

  </div>
