<div class="page-container">
  <div class="page-header">
    <div class="breadcrumb">
      <a routerLink="/mypage">마이페이지</a>
      <span>›</span>
      <span>프로필</span>
    </div>

    <h1>프로필</h1>
    <p>Firebase 소셜 로그인 계정 정보를 확인할 수 있습니다.</p>
  </div>

  <div class="info-card">
    <!-- <div class="info-row">
      <span class="label">UID</span>
      <span class="value">{{ memberUid }}</span>
    </div> -->
    <div class="info-row">
      <span class="label">이름</span>
      <span class="value">{{ name || '-' }}</span>
    </div>
    <div class="info-row">
      <span class="label">이메일</span>
      <span class="value">{{ email || '-' }}</span>
    </div>
    <div class="info-row">
      <span class="label">휴대폰</span>
      <span class="value">{{ phoneNumber || '-' }}</span>
    </div>
    <div class="info-row">
      <span class="label">가입일</span>
      <span class="value">{{ createdAt || '-' }}</span>
    </div>
    <div class="info-row">
      <span class="label">로그인 방식</span>
      <span class="value">{{ provider || '-' }}</span>
    </div>
  </div>
</div>
