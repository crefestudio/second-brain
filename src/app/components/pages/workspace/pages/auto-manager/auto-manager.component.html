<div class="page-container">

  <div class="page-header">

    <div class="breadcrumb">

      <a routerLink="/service">
        워크스페이스
      </a>

      <span>›</span>

      <span>자동화 관리</span>

    </div>

    <h1>자동화 에이전트 관리</h1>

    <p>
      자동화 에이전트의 등록 및 이용 정보를 관리합니다.
    </p>

  </div>
  <div class="table-card">
    <table class="service-table">
      <thead>
        <tr>
          <th>범주</th>
          <th>에이전트 이름</th>
          <th>규칙 요약</th>
          <th>현재 상태</th>
          <th>사용 여부&nbsp;
            <span class="help-icon">ⓘ
              <span class="tooltip">에이전트를 시작하시려면 스위치를 ON으로 해주세요.</span>
            </span>
          </th>
          <th>로그 보기</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let agent of automationAgents">

          <!-- 범주 -->
          <td>
            <div class="category-path">
              <span *ngFor="let category of agent.category; let last = last">

                <span class="category-item">
                  {{ category }}
                </span>
                <span *ngIf="!last" class="category-divider">
                  &nbsp;❯&nbsp;
                </span>
              </span>
            </div>
          </td>

          <!-- 이름 -->
          <td>
            <div class="automation-name">
              {{ agent.name }}

              <span class="help-icon">
                ⓘ
                <span class="tooltip">
                  {{ agent.tooltip }}
                </span>
              </span>
            </div>
          </td>

          <!-- 설명 -->
          <td>
            <div class="automation-desc">
              <div *ngFor="let desc of agent.description">
                • {{ desc }}
              </div>
            </div>
          </td>

          <!-- 상태 -->
          <td>
            <span class="badge success" *ngIf="agent.status === 'running'">
              동작중
            </span>

            <span class="badge pending" *ngIf="agent.status === 'waiting'">
              정지됨
            </span>

            <span class="badge error" *ngIf="agent.status === 'error'">
              오류
            </span>
          </td>

          <!-- 활성화 -->
          <td>
            <label class="switch">
              <input type="checkbox" [(ngModel)]="agent.enabled" (change)="onChangeAgentEnabled(agent)">
              <span class="slider"></span>
            </label>
          </td>

          <!-- 로그 -->
          <td>
            <button class="log-btn" [routerLink]="['/workspace/event-log', agent.id]">
              로그 보기
            </button>
          </td>

        </tr>
      </tbody>

    </table>
  </div>

</div>
