<div class="page-container">
  <div class="page-header">
    <div class="breadcrumb">
      <span>워크스페이스</span>
      <span>›</span>
      <span>로그 보기</span>
    </div>
    <h1>자동화 에이전트 실행 로그 보기</h1>
    <p>
      자동화 실행 내역을 조회합니다.
    </p>
  </div>

  <!-- 에이전트 필터 -->
  <div class="agent-filter-card">
    <button class="agent-chip" [class.active]="selectedAgentId === ''" (click)="selectAgent('')">
      전체
    </button>
    <button *ngFor="let agent of agents" class="agent-chip" [ngClass]="getAgentClass(agent.id)"
      [class.active]="selectedAgentId === agent.id" (click)="selectAgent(agent.id)">
      {{ agent.name }}
    </button>
  </div>

  <!-- 검색 -->
  <div class="filter-card">
    <input type="date" [(ngModel)]="startDate">
    <span>~</span>
    <input type="date" [(ngModel)]="endDate">
    <button class="search-btn" (click)="search()">
      조회
    </button>
  </div>

  <!-- 테이블 -->
  <div class="table-card">
    <table class="service-table">
      <thead>
        <tr>
          <th>발생 시간</th>
          <th>에이전트</th>
          <th>이벤트</th>
          <th>상태</th>
          <th>상세 보기</th>
        </tr>
      </thead>

      <tbody>
        <ng-container *ngFor="let log of logs">

          <!-- 기본 행 -->
          <tr>
            <td>
              {{ log.updatedAt | date:'yyyy.MM.dd HH:mm:ss' }}
            </td>

            <td>
              <span class="agent-badge" [ngClass]="getAgentClass(log.agentId)">
                {{ getAgentName(log.agentId) }}
              </span>
            </td>

            <td>
              <span [innerHTML]="log.eventTitle"></span>
            </td>

            <td>
              <span class="badge success" *ngIf="log.status=='running' || log.status=='completed'">
                {{ log.status=='running' ? '동작중' : '완료' }}
              </span>

              <span class="badge pending" *ngIf="log.status=='start' || log.status=='waiting'">
                대기중
              </span>

              <span class="badge error" *ngIf="log.status=='failed' || log.status=='error'">
                오류
              </span>
            </td>

            <td>
              <button class="log-btn" (click)="toggleLog(log)">
                {{ selectedLog === log ? '닫기' : '상세 보기' }}
              </button>
            </td>
          </tr>

          <!-- 상세 보기 -->
          <tr *ngIf="selectedLog === log" class="detail-row">
            <td colspan="5">
              <div class="detail-card">

                <div class="detail-header">
                  로그 상세
                </div>

                <div class="detail-content">
                  <div class="detail-line" *ngFor="let line of getDescriptionLines(log.description)">
                    <span class="detail-key">
                      {{ line.key }}
                    </span>
                    <span class="detail-value">
                      {{ line.value }}
                    </span>
                  </div>
                </div>
              </div>
            </td>
          </tr>

        </ng-container>
      </tbody>
    </table>
  </div>
  <div class="load-more" *ngIf="hasMore">
    <button class="load-more-btn" (click)="loadMore()">
      더 불러오기
      <span class="arrow">▾</span>
    </button>
  </div>
</div>
