<main class="unsubscribe-page"><section class="card"><h1>알림 수신 차단</h1><p>비회원 고객님의 이메일과 메시지 수신을 모두 차단합니다. 차단 후에는 노셔너블에서 안내를 보내지 않습니다.</p><label>이메일<input type="email" [(ngModel)]="email" placeholder="example@email.com"></label><span class="or">또는</span><label>휴대폰 번호<input type="tel" [(ngModel)]="phone" placeholder="01012345678"></label>@if (error) { <p class="error">{{ error }}</p> } @if (message) { <p class="success">{{ message }}</p> } @else { <button (click)="submit()" [disabled]="isSubmitting">{{ isSubmitting ? '처리 중…' : '수신 차단하기' }}</button> }<small>회원은 로그인 후 프로필에서 마케팅 수신 여부를 변경할 수 있습니다.</small></section></main>
