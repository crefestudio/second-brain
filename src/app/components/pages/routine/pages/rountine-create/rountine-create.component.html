<div class="routine-card">

  <div class="routine-header">
    <span class="routine-icon">🧩</span>

    <div class="routine-title">
      <input
        class="routine-name"
        type="text"
        placeholder="루틴 이름을 입력하세요"
        [(ngModel)]="routine.name" />
    </div>
  </div>

  <!-- 요일 -->
  <div class="days-row">

    @for(day of weekDays; track day) {

      <button
        class="day-btn"
        [class.active]="isSelected(routine, day)"
        (click)="toggleDay(routine, day)">

        {{ day }}

      </button>

    }

  </div>

  <!-- 시간 + 소요시간 -->
  <div class="input-row">

    <div class="field">
      <label>시간</label>
      <input type="time" [(ngModel)]="routine.time">
    </div>

    <div class="field">
      <label>소요시간</label>
      <select [(ngModel)]="routine.duration">
        <option [value]="5">5분</option>
        <option [value]="10">10분</option>
        <option [value]="15">15분</option>
        <option [value]="30">30분</option>
        <option [value]="60">1시간</option>
      </select>
    </div>

  </div>

  <!-- 🔥 시작일 (완전히 분리된 한 줄) -->
  <div class="input-row">

    <div class="field full">
      <label>시작일</label>
      <input type="date" [(ngModel)]="routine.startDate">
    </div>

  </div>

  <!-- 추가 버튼 -->
  <button class="add-btn" (click)="addRoutine(routine)">
    + 추가하기
  </button>

</div>
