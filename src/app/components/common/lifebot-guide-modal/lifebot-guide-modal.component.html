<div *ngIf="open" class="guide-overlay" role="presentation" (click)="close()">
    <section class="guide-modal" role="dialog" aria-modal="true" aria-labelledby="lifebot-guide-title" (click)="$event.stopPropagation()">
        <header class="guide-modal-header">
            <h2 id="lifebot-guide-title">라이프봇 가이드</h2>
            <button type="button" class="guide-close" aria-label="가이드 닫기" (click)="close()">×</button>
        </header>

        <div class="guide-modal-body">
            <nav class="guide-index" aria-label="가이드 목차">
                <a href="#lifeup-update">라이프업 업데이트</a>
                <a class="guide-index-child" href="#backup-method">기존 템플릿 백업 방법 보기</a>
            </nav>

            <main class="guide-content">
                <section id="lifeup-update" class="guide-section">
                    <p class="guide-eyebrow">라이프업 업데이트</p>
                    <h3 id="backup-method">기존 템플릿 백업 방법 보기</h3>
                    <p class="guide-intro">업데이트 전, 기존 <strong>내 라이프업 1.3</strong> 페이지를 복제해 안전하게 백업해 주세요.</p>

                    <article class="guide-step">
                        <div class="guide-step-number">1</div>
                        <div>
                            <h4>페이지 메뉴 열기</h4>
                            <p>페이지 목록에서 <strong>내 라이프업 1.3</strong> 옆의 <code>···</code> 메뉴를 누릅니다.</p>
                            <img src="assets/images/lifeup_depulication1.png" alt="내 라이프업 1.3 옆 더보기 메뉴를 여는 화면">
                        </div>
                    </article>

                    <article class="guide-step">
                        <div class="guide-step-number">2</div>
                        <div>
                            <h4>복제 선택</h4>
                            <p>메뉴에서 <strong>복제</strong>를 선택합니다.</p>
                            <img src="assets/images/lifeup_depulication2.png" alt="Notion 메뉴에서 복제를 선택하는 화면">
                        </div>
                    </article>

                    <article class="guide-step">
                        <div class="guide-step-number">3</div>
                        <div>
                            <h4>백업본 이름 변경</h4>
                            <p>복제가 완료되면 목록에 새 페이지가 나타납니다. 복제한 페이지를 열어 제목을 <strong>라이프업 1.3 백업</strong>처럼 알아보기 쉽게 변경해 주세요.</p>
                            <img src="assets/images/lifeup_depulication3.png" alt="복제한 라이프업 페이지의 제목을 백업으로 변경하는 화면">
                        </div>
                    </article>
                </section>
            </main>
        </div>
    </section>
</div>
